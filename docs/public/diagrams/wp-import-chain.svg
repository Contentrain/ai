<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 120" width="680" height="120" role="img" aria-labelledby="wp-import-chain-t wp-import-chain-d">
<title id="wp-import-chain-t">Where wp-import sits in the migration chain</title>
<desc id="wp-import-chain-d">wp-import (MIT) produces RawIR; the closed-source migration engine turns it into ProjectIR; emitter-astro (MIT) writes the Astro project; verify (MIT) checks it.</desc>
<style>
.dg-t{fill:var(--vp-c-text-1,#1e293b);font:600 14px Inter,system-ui,sans-serif}
.dg-s{fill:var(--vp-c-text-2,#64748b);font:11.5px "SF Mono",Menlo,Consolas,monospace}
.dg-c{fill:var(--vp-c-text-1,#1e293b);font:12px "SF Mono",Menlo,Consolas,monospace}
.dg-n{fill:var(--vp-c-bg-soft,#f6f6f7);stroke:#a1a1aa;stroke-width:1.6}
.dg-h{stroke:#3b5bf0;stroke-width:2}
.dg-a{fill:none;stroke:var(--vp-c-text-2,#6b7280);stroke-width:1.6;stroke-dasharray:5 5;stroke-linecap:round}
.dg-ah{fill:none;stroke:var(--vp-c-text-2,#6b7280);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg-g{fill:none;stroke:var(--vp-c-divider,#d4d4d8);stroke-width:1.4;stroke-dasharray:3 5}
</style>
<defs>
<filter id="wp-import-chain-f" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="15"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
<marker id="wp-import-chain-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M1 1 L8 5 L1 9"/></marker>
</defs>
<g>
<rect class="dg-n" x="4" y="14" width="100" height="50" rx="14" filter="url(#wp-import-chain-f)"/>

<text x="54" y="44" text-anchor="middle" class="dg-t">wp-import</text>

</g>
<g><rect x="35" y="83" width="38" height="19" rx="9.5" fill="#3b5bf0" fill-opacity=".12" stroke="#3b5bf0" stroke-width="1.2"/><text x="54" y="96" text-anchor="middle" style="font:600 11px Inter,system-ui,sans-serif" fill="#3b5bf0">MIT</text></g>
<g>
<rect class="dg-n" x="134" y="14" width="96" height="50" rx="14" filter="url(#wp-import-chain-f)"/>

<text x="182" y="44" text-anchor="middle" class="dg-t">RawIR</text>

</g>

<g>
<rect class="dg-n dg-h" x="260" y="14" width="150" height="50" rx="14" filter="url(#wp-import-chain-f)"/>

<text x="335" y="35" text-anchor="middle" class="dg-t">migration engine</text>
<text x="335" y="52" text-anchor="middle" class="dg-s">→ ProjectIR</text>
</g>
<g><rect x="283" y="83" width="104" height="19" rx="9.5" fill="#7c4dff" fill-opacity=".12" stroke="#7c4dff" stroke-width="1.2"/><text x="335" y="96" text-anchor="middle" style="font:600 11px Inter,system-ui,sans-serif" fill="#7c4dff">closed source</text></g>
<g>
<rect class="dg-n" x="440" y="14" width="120" height="50" rx="14" filter="url(#wp-import-chain-f)"/>

<text x="500" y="44" text-anchor="middle" class="dg-t">emitter-astro</text>

</g>
<g><rect x="481" y="83" width="38" height="19" rx="9.5" fill="#3b5bf0" fill-opacity=".12" stroke="#3b5bf0" stroke-width="1.2"/><text x="500" y="96" text-anchor="middle" style="font:600 11px Inter,system-ui,sans-serif" fill="#3b5bf0">MIT</text></g>
<g>
<rect class="dg-n" x="590" y="14" width="86" height="50" rx="14" filter="url(#wp-import-chain-f)"/>

<text x="633" y="44" text-anchor="middle" class="dg-t">verify</text>

</g>
<g><rect x="614" y="83" width="38" height="19" rx="9.5" fill="#3b5bf0" fill-opacity=".12" stroke="#3b5bf0" stroke-width="1.2"/><text x="633" y="96" text-anchor="middle" style="font:600 11px Inter,system-ui,sans-serif" fill="#3b5bf0">MIT</text></g>
<path class="dg-a" d="M109 39 H129" marker-end="url(#wp-import-chain-m)"/>
<path class="dg-a" d="M235 39 H255" marker-end="url(#wp-import-chain-m)"/>
<path class="dg-a" d="M415 39 H435" marker-end="url(#wp-import-chain-m)"/>
<path class="dg-a" d="M565 39 H585" marker-end="url(#wp-import-chain-m)"/>
</svg>
