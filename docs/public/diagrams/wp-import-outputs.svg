<marker id="wp-import-outputs-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M1 1 L8 5 L1 9"/></marker>
<pattern id="wp-import-outputs-p" width="24" height="24" patternUnits="userSpaceOnUse"><path class="dg-grid" d="M24 0 V24 M0 24 H24"/></pattern>
<radialGradient id="wp-import-outputs-rg" cx=".5" cy=".5" r=".6"><stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="wp-import-outputs-mk"><rect width="680" height="300" fill="url(#wp-import-outputs-rg)"/></mask>
</defs>
<rect width="680" height="300" fill="url(#wp-import-outputs-p)" mask="url(#wp-import-outputs-mk)"/>
<style>
.c-ink{fill:none;stroke:var(--vp-c-text-1,#1e293b);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.c-ink2{fill:none;stroke:var(--vp-c-text-2,#64748b);stroke-width:1.2;stroke-linecap:round}
.c-blue{fill:var(--vp-c-brand-1,#1f4fff)}
.c-blues{fill:none;stroke:var(--vp-c-brand-1,#1f4fff);stroke-width:1.8;stroke-linecap:round}
.c-paper{fill:var(--vp-c-bg,#fff)}
.c-papers{fill:none;stroke:var(--vp-c-bg,#fff);stroke-width:1.8;stroke-linecap:round}
