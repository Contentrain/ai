<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" role="img" aria-labelledby="t d">
<title id="t">How a Contentrain write reaches your repository</title>
<desc id="d">An agent calls an MCP write tool. MCP validates the change and commits it on an isolated cr/* branch. With the review workflow a person approves the branch; with auto-merge (the default) it goes straight in. The branch merges into the contentrain branch, the base branch fast-forwards, and the result is plain JSON and Markdown in .contentrain/.</desc>
