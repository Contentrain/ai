name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ai@contentrain.io"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Docs facts in sync
        run: |
          pnpm docs:check || {
            echo "::error::The docs disagree with the code — a stale number, or an example whose imports no longer resolve. Run 'pnpm docs:check' for the list."
            exit 1
          }

      - name: Test
        run: pnpm test

      - name: Emitted Astro site passes astro check
        # The unit suite asserts emitted strings; this installs an emitted site
        # with npm and runs the check its build runs first (0.16.0 shipped an
        # archive page that failed it).
        run: pnpm --filter @contentrain/emitter-astro test:astro

      - name: Astro starter passes its gates
        # templates/astro-starter is copied out, installed on its own and
        # checked with the SDK at HEAD: empty, then with a WordPress-shaped
        # demo site laid over it (astro check, knip, build, built-site checks),
        # and once more with the demo's media served from a stand-in Studio host,
        # a Turkish-only site (config default locale tr, site.language tr),
        # an Arabic one (right to left: <html lang="ar" dir="rtl">)
        # a site whose post addresses are ja / ar / tr / de words (unicode-slugs),
        # a post at its kept old address (and one whose slug left it: a 301),
        # every other entry kind at its kept old address (pages, terms, a custom type: entry-path; a renamed one of each: a 301),
        # a migrated comment thread drawn at build time (unbound and bound to Studio),
        # a form the owner kept on WordPress,
        # and a sample build whose links to the source's other pages go to the live site.
        run: |
          node scripts/starter-gates.mjs --local-sdk
          node scripts/starter-gates.mjs --local-sdk --fixture wp-demo
          node scripts/starter-gates.mjs --local-sdk --fixture wp-demo --media studio
          node scripts/starter-gates.mjs --local-sdk --fixture tr-site
          node scripts/starter-gates.mjs --local-sdk --fixture tr-site-implicit
          node scripts/starter-gates.mjs --local-sdk --fixture tr-site-wp
          node scripts/starter-gates.mjs --local-sdk --fixture unicode-slugs
          node scripts/starter-gates.mjs --local-sdk --fixture category-permalinks
          node scripts/starter-gates.mjs --local-sdk --fixture time-zone
          node scripts/starter-gates.mjs --local-sdk --fixture page-prefix
          node scripts/starter-gates.mjs --local-sdk --fixture post-path
          node scripts/starter-gates.mjs --local-sdk --fixture entry-path
          node scripts/starter-gates.mjs --local-sdk --fixture og-fields
          node scripts/starter-gates.mjs --local-sdk --fixture ar-site
          node scripts/starter-gates.mjs --local-sdk --fixture comments
          node scripts/starter-gates.mjs --local-sdk --fixture comments --media studio
          node scripts/starter-gates.mjs --local-sdk --fixture forms-wordpress
          node scripts/starter-gates.mjs --local-sdk --fixture empty-pages
          node scripts/starter-gates.mjs --local-sdk --fixture composed-home
          node scripts/starter-gates.mjs --local-sdk --fixture composed-blog
          node scripts/starter-gates.mjs --local-sdk --fixture composed-blog-nolist
          node scripts/starter-gates.mjs --local-sdk --fixture sample-links

      - name: Plugin payload in sync
        run: |
          pnpm plugin:build
          git diff --exit-code -- plugins/contentrain .claude-plugin || {
            echo "::error::Plugin payload or manifest version is stale. Run 'pnpm plugin:build' and commit the result."
            exit 1
          }

      - name: Release checks
        run: pnpm release:check
