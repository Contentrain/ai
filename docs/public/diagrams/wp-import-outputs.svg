<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" role="img" aria-labelledby="wp-import-outputs-t wp-import-outputs-d">
<title id="wp-import-outputs-t">What @contentrain/wp-import produces</title>
<desc id="wp-import-outputs-d">A WXR file or the REST API becomes RawIR (source-faithful, provenance-stamped) through parseWxr or fetchRestRawIR. rawToContentrain turns RawIR into the .contentrain content store and an EntrySourceMap. buildCommentsExport turns RawIR plus the EntrySourceMap into a CommentsExport, the intake payload for a live comments service.</desc>
<style>
.dg-t{fill:var(--vp-c-text-1,#1e293b);font:600 14px Inter,system-ui,sans-serif}
.dg-s{fill:var(--vp-c-text-2,#64748b);font:11.5px "SF Mono",Menlo,Consolas,monospace}
.dg-c{fill:var(--vp-c-text-1,#1e293b);font:12px "SF Mono",Menlo,Consolas,monospace}
.dg-n{fill:var(--vp-c-bg-soft,#f6f6f7);stroke:#a1a1aa;stroke-width:1.6}
.dg-h{stroke:#3b5bf0;stroke-width:2}
.dg-a{fill:none;stroke:var(--vp-c-text-2,#6b7280);stroke-width:1.6;stroke-dasharray:5 5;stroke-linecap:round}
.dg-ah{fill:none;stroke:var(--vp-c-text-2,#6b7280);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg-g{fill:none;stroke:var(--vp-c-divider,#d4d4d8);stroke-width:1.4;stroke-dasharray:3 5}
</style>
<defs>
<filter id="wp-import-outputs-f" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
<marker id="wp-import-outputs-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M1 1 L8 5 L1 9"/></marker>
</defs>
<g>
<rect class="dg-n" x="10" y="106" width="180" height="56" rx="14" filter="url(#wp-import-outputs-f)"/>

<text x="100" y="130" text-anchor="middle" class="dg-t">WXR file</text>
<text x="100" y="147" text-anchor="middle" class="dg-s">or REST API</text>
</g>
<g>
<rect class="dg-n dg-h" x="250" y="106" width="190" height="56" rx="14" filter="url(#wp-import-outputs-f)"/>

<text x="345" y="121" text-anchor="middle" class="dg-t">RawIR</text>
<text x="345" y="138" text-anchor="middle" class="dg-s">source-faithful,</text>
<text x="345" y="156" text-anchor="middle" class="dg-s">provenance-stamped</text>
</g>
<g>
<rect class="dg-n" x="492" y="10" width="180" height="50" rx="14" filter="url(#wp-import-outputs-f)"/>

<text x="582" y="31" text-anchor="middle" class="dg-t">.contentrain/</text>
<text x="582" y="48" text-anchor="middle" class="dg-s">content store</text>
</g>
<g>
<rect class="dg-n" x="492" y="106" width="180" height="50" rx="14" filter="url(#wp-import-outputs-f)"/>

<text x="582" y="127" text-anchor="middle" class="dg-t">EntrySourceMap</text>
<text x="582" y="144" text-anchor="middle" class="dg-s">WP id → entry address</text>
</g>
<g>
<rect class="dg-n" x="492" y="206" width="180" height="56" rx="14" filter="url(#wp-import-outputs-f)"/>

<text x="582" y="230" text-anchor="middle" class="dg-t">CommentsExport</text>
<text x="582" y="247" text-anchor="middle" class="dg-s">live-service intake</text>
</g>
<path class="dg-a" d="M196 134 H242" marker-end="url(#wp-import-outputs-m)"/>
<text x="219" y="100" text-anchor="middle" class="dg-s">parseWxr</text>
<text x="219" y="184" text-anchor="middle" class="dg-s">fetchRestRawIR</text>
<path class="dg-a" d="M446 120 C 466 100, 466 40, 486 36" marker-end="url(#wp-import-outputs-m)"/>
<path class="dg-a" d="M446 132 H486" marker-end="url(#wp-import-outputs-m)"/>
<text x="450" y="70" text-anchor="end" class="dg-s">rawToContentrain</text>
<path class="dg-a" d="M446 146 C 466 170, 466 230, 486 234" marker-end="url(#wp-import-outputs-m)"/>
<path class="dg-a" d="M582 162 V200" marker-end="url(#wp-import-outputs-m)"/>
<text x="470" y="252" text-anchor="end" class="dg-s">buildCommentsExport</text>
</svg>
