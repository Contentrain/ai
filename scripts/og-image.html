<!doctype html>
<!--
  Source template for docs/public/og-image.png (1200x630): copy left, the home hero drawing right.
  Regenerate with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
    --screenshot=docs/public/og-image.png --window-size=1200,630 --hide-scrollbars \
    --virtual-time-budget=8000 "file://$PWD/scripts/og-image.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Inter, sans-serif; color: #0f172a; background: linear-gradient(160deg, #f8fafc 0%, #f4f6fb 60%, #e9edfb 100%); position: relative; }
  .top { position: absolute; left: 60px; top: 52px; display: flex; align-items: center; gap: 10px; }
  .top img { height: 34px; width: auto; }
  .lab { margin-left: 6px; padding-left: 16px; border-left: 1px solid #cbd5e1; font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: 0.24em; color: #64748b; }
  .copy { position: absolute; left: 60px; top: 150px; width: 530px; }
  h1 { font-size: 46px; font-weight: 800; line-height: 1.08; letter-spacing: -0.025em; }
  h1 em { font-style: normal; color: #1f4fff; }
  .sub { margin-top: 24px; font-size: 22px; line-height: 1.45; color: #64748b; }
  .art { position: absolute; right: 44px; top: 110px; width: 532px; height: 337px; border-radius: 22px; overflow: hidden; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10), 0 0 0 1px rgba(148, 163, 184, 0.25); }
  .art img { width: 100%; height: 100%; display: block; }
  .foot { position: absolute; left: 60px; right: 60px; bottom: 52px; display: flex; align-items: center; justify-content: space-between; }
  .chips { display: flex; gap: 12px; }
  .chip { border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; padding: 10px 18px; font-size: 19px; font-weight: 600; color: #334155; }
  .url { font-size: 22px; font-weight: 600; color: #1f4fff; }
</style>
</head>
<body>
  <div class="top"><img src="../docs/public/logo/color-icon-black-text.svg" alt="Contentrain"><span class="lab">OPEN SOURCE</span></div>
  <div class="copy">
    <h1>Extract, govern, and ship structured content from your <em>codebase</em>.</h1>
    <p class="sub">Open-source MCP, CLI and SDK packages for Git-native content. Agents do the work; Contentrain enforces schema and review.</p>
  </div>
  <div class="art"><img src="../docs/public/hero.webp" alt=""></div>
  <div class="foot">
    <div class="chips"><span class="chip">27 MCP tools</span><span class="chip">16 agent skills</span><span class="chip">27 field types</span></div>
    <span class="url">ai.contentrain.io</span>
  </div>
</body>
</html>
