name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ai@contentrain.io"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Docs facts in sync
        run: |
          pnpm docs:check || {
            echo "::error::The docs disagree with the code — a stale number, or an example whose imports no longer resolve. Run 'pnpm docs:check' for the list."
            exit 1
          }

      - name: Test
        run: pnpm test

      - name: Emitted Astro site passes astro check
        # The unit suite asserts emitted strings; this installs an emitted site
        # with npm and runs the check its build runs first (0.16.0 shipped an
        # archive page that failed it).
        run: pnpm --filter @contentrain/emitter-astro test:astro

      - name: Astro starter passes its gates
        # templates/astro-starter is copied out, installed on its own and
        # checked with the SDK at HEAD: empty, then with a WordPress-shaped
        # demo site laid over it (astro check, knip, build, built-site checks).
        run: |
          node scripts/starter-gates.mjs --local-sdk
          node scripts/starter-gates.mjs --local-sdk --fixture wp-demo

      - name: Kit components render as their baselines
        # Every fixture of every astro-kit component, in a copy of the starter,
        # at 390/768/1280 px against visual/linux/. A baseline that does not
        # exist yet is written and uploaded below for review and commit.
        run: |
          pnpm --filter @contentrain/astro-kit exec playwright install --with-deps chromium
          node packages/astro-kit/scripts/visual.mjs --local-sdk

      - name: Upload kit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-kit-visual-linux
          path: packages/astro-kit/visual/linux
          if-no-files-found: ignore

      - name: Plugin payload in sync
        run: |
          pnpm plugin:build
          git diff --exit-code -- plugins/contentrain .claude-plugin || {
            echo "::error::Plugin payload or manifest version is stale. Run 'pnpm plugin:build' and commit the result."
            exit 1
          }

      - name: Release checks
        run: pnpm release:check
