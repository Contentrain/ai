.c-bad{fill:none;stroke:var(--vp-c-red-1,#dc2626);stroke-width:2;stroke-linecap:round}
.c-grainp{fill:var(--vp-c-text-1,#1e293b);opacity:.07}
.c-hatchp{stroke:var(--vp-c-text-1,#1e293b);stroke-width:1.1;opacity:.28}
</style>
