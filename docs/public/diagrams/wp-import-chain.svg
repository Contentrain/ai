<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="680" height="262" role="img" aria-labelledby="wp-import-chain-t wp-import-chain-d">
<title id="wp-import-chain-t">Where wp-import sits in the migration chain</title>
<desc id="wp-import-chain-d">wp-import (MIT) produces RawIR; the closed-source migration engine turns it into ProjectIR; emitter-astro (MIT) writes the Astro project; verify (MIT) checks it.</desc>
