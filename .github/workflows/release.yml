name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release run. Publishing is not a step that can be safely
  # interrupted: merging the release PR and then merging anything else shortly
  # after would kill the run that was about to publish, leaving the bumped
  # versions committed but absent from npm — with no failure anywhere to show
  # it. That happened to @contentrain/mcp 2.3.0. Queue instead.
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x; npm trusted publishing (OIDC) requires >= 11.5.1.
      # Pinned to 11.x on purpose: npm 12.0.0 ships libnpmpublish's
      # provenance.js but does NOT bundle its `sigstore` dependency, so
      # `changeset publish` dies with "Cannot find module 'sigstore'" while
      # generating provenance. 11.18.0 bundles sigstore correctly.
      - name: Upgrade npm for trusted publishing (OIDC)
        run: npm install -g npm@11.18.0

      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ai@contentrain.io"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Emitted Astro site passes astro check
        # The unit suite asserts emitted strings; this installs an emitted site
        # with npm and runs the check its build runs first (0.16.0 shipped an
        # archive page that failed it).
        run: pnpm --filter @contentrain/emitter-astro test:astro

      - name: Release checks
        run: pnpm release:check

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          # npm auth is via OIDC trusted publishing (id-token: write above) — no NPM_TOKEN.
          # Each package must have a trusted publisher configured on npmjs.com:
          #   org=Contentrain, repo=ai, workflow=release.yml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Whether the MCP Registry is behind npm, read from both rather than from
      # what this run published. A run that published only some packages (a
      # re-run after a partial failure, or a workflow_dispatch) still catches
      # the registry up: 3.11.23 reached npm in one attempt, and the re-run that
      # published the rest skipped the registry because it had not published
      # @contentrain/mcp itself. Skipped while a release PR is open, since main
      # then holds versions that are not on npm yet.
      - name: Check MCP Registry against npm
        id: registry
        if: steps.changesets.outputs.hasChangesets == 'false'
        working-directory: packages/mcp
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          NAME=$(jq -r .name server.json)
          NPM=$(npm view @contentrain/mcp version 2>/dev/null || true)
          STATUS=$(curl -s -o registry.json -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/$(jq -rn --arg n "$NAME" '$n|@uri')/versions/latest")
          case "$STATUS" in
            200) REGISTRY=$(jq -r '.server.version' registry.json) ;;
            404) REGISTRY=none ;;
            *) echo "::error::MCP Registry answered $STATUS for $NAME"; exit 1 ;;
          esac
          rm -f registry.json
          echo "package.json $LOCAL, npm $NPM, registry $REGISTRY"
          # Exit 0 when the first version is newer than the second.
          newer() {
            node -e '
              const [a, b] = process.argv.slice(1).map(v => v.split("-")[0].split(".").map(Number))
              const i = a.findIndex((n, k) => n !== b[k])
              process.exit(i >= 0 && a[i] > b[i] ? 0 : 1)
            ' "$1" "$2"
          }
          if [ "$NPM" != "$LOCAL" ] && [ "$PUBLISHED" = "true" ]; then
            # Published in this run but not visible yet: the next step waits.
            echo "behind=true" >> "$GITHUB_OUTPUT"
          elif [ "$NPM" != "$LOCAL" ]; then
            echo "npm serves ${NPM:-nothing}, not $LOCAL; nothing to send to the registry"
          elif [ "$REGISTRY" = none ] || newer "$NPM" "$REGISTRY"; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "registry $REGISTRY is behind npm $NPM"
          else
            echo "registry is up to date"
          fi

      - name: Publish to MCP Registry
        if: steps.registry.outputs.behind == 'true'
        working-directory: packages/mcp
        run: |
          # Install mcp-publisher
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

          # Update server.json version to match published package
          MCP_VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$MCP_VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

          # Wait for npm propagation. The registry validates that the version
          # exists on npm before accepting it, and a just-published version can
          # take a couple of minutes to become visible — that race is what made
          # this step fail with "version '3.1.5' was not found (status: 404)"
          # while the package was already published.
          for i in $(seq 1 30); do
            if npm view "@contentrain/mcp@$MCP_VERSION" version >/dev/null 2>&1; then
              echo "npm has @contentrain/mcp@$MCP_VERSION"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::@contentrain/mcp@$MCP_VERSION did not appear on npm within 5 minutes"
              exit 1
            fi
            echo "waiting for npm to serve @contentrain/mcp@$MCP_VERSION ($i/30)"
            sleep 10
          done

          # Authenticate via GitHub OIDC (no secrets needed)
          ./mcp-publisher login github-oidc

          # Publish, retrying while the registry's own view of npm catches up.
          for attempt in 1 2 3; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "mcp-publisher attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::mcp-publisher failed after 3 attempts"
          exit 1
